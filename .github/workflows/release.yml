name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.10.3)'
        required: true
        default: 'v0.10.3'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and Package DMG
        run: ./Scripts/package_dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: build/DontTouchMyMac.dmg
          name: Release ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
