name: DontTouchMyMac
options:
  minimumXcodeGenVersion: 2.40.0
  developmentLanguage: en
  useBaseInternationalization: false
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: false
    CLANG_MODULE_CACHE_PATH: '$(PROJECT_DIR)/build/ModuleCache'
    SWIFT_MODULE_CACHE_PATH: '$(PROJECT_DIR)/build/ModuleCache'
fileGroups:
  - README.md
  - Scripts
  - docs
  - project.yml
targets:
  DontTouchMyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: Assets/Voices
        type: folder
        buildPhase: resources
      - path: Assets/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Don't Touch My Mac"
        PRODUCT_MODULE_NAME: DontTouchMyMac
        PRODUCT_BUNDLE_IDENTIFIER: com.localdemo.donttouchmymac
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_APP_SANDBOX: false
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
schemes:
  DontTouchMyMac:
    build:
      targets:
        DontTouchMyMac: all
    run:
      config: Debug
    archive:
      config: Release
